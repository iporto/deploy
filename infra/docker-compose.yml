# Infra de desenvolvimento — sobe UMA vez por máquina (ou por contexto Docker).
#
# Cria a rede `shared` e os serviços que todo projeto espera encontrar nela.
# Os projetos declaram essa rede como `external: true` e se penduram aqui.
#
# Nomes de container são FIXOS de propósito (infra-mysql, infra-redis, infra-mail):
# é assim que o .env de cada app acha o banco sem mudar entre máquinas.
#
# Suba com:  deploy-infra up
services:
  # ─── Acesso do Traefik ao Docker, em duas camadas ──────────────────────────
  #
  # ⚠️ O Traefik fala com a API do Docker em v1.24, e o Docker 29+ exige no
  #    mínimo v1.44 — o provider falha com "client version 1.24 is too old" e
  #    NENHUMA rota é descoberta. O sintoma é 404 em tudo, sem erro aparente.
  #    Não é versão do Traefik: v3.3, v3.4 e v3.5 falham igual, e
  #    DOCKER_API_VERSION não resolve.
  #
  # A saída é este par: um proxy somente-leitura do socket, e um nginx que
  # reescreve a versão da API na URL. De quebra, o Traefik deixa de ter acesso
  # direto ao socket do Docker — ele só enxerga containers e redes, em leitura.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-docker-proxy
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy
    restart: unless-stopped

  docker-api-compat:
    image: nginx:alpine
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-docker-api-compat
    depends_on:
      - docker-proxy
    volumes:
      - ./docker-api-compat.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - docker-proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.3
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-traefik
    depends_on:
      - docker-api-compat
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-api-compat:2376"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--ping=true"
    ports:
      # A porta 80 pode já estar ocupada na máquina do dev — por isso é variável.
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      # ⚠️ Dashboard SEM autenticação: fica preso ao loopback. Nunca publicar em 0.0.0.0.
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    networks:
      - shared
      - docker-proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql:
    image: mariadb:latest
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-mysql
    environment:
      - TZ=${TZ:-UTC}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?defina em infra/.env.dev}
      - MYSQL_ROOT_HOST=%
    command:
      - --default-time-zone=${TZ:-UTC}
      - --max-connections=150
      # Dimensionado para estação de trabalho. Num servidor dedicado, aumente.
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-256M}
      - --innodb-flush-log-at-trx-commit=2
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql:rw
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-redis
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "20 1"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD:?defina em infra/.env.dev}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    platform: ${INFRA_PLATFORM:-linux/amd64}
    container_name: infra-mail
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"    # interface web
    volumes:
      - mailpit-data:/data
    networks:
      - shared
    restart: unless-stopped

networks:
  shared:
    name: shared
  # Rede interna: só o Traefik e o proxy. Não é alcançável de fora.
  docker-proxy:
    name: infra-docker-proxy
    internal: true

volumes:
  mysql-data:
  redis-data:
  mailpit-data:
