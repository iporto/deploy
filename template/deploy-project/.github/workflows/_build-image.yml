# ─────────────────────────────────────────────────────────────────────────────
# Workflow reutilizável: constrói e publica UMA imagem de app no GHCR e avisa o
# Coolify.
#
# Este repositório é o dono dos Dockerfiles. Os repositórios de app só avisam
# que há código novo (repository_dispatch) — o build acontece aqui.
#
# Por que centralizado: um Dockerfile por app, num lugar só, muda todos de uma
# vez. E o contexto de build pode ser inspecionado antes do push — é o que
# permite a varredura de segredo em texto puro logo abaixo.
# ─────────────────────────────────────────────────────────────────────────────
name: Build image (reusable)

on:
  workflow_call:
    inputs:
      app:
        description: 'Diretório do app em .docker/Code (ex.: api.meuprojeto.com)'
        required: true
        type: string
      code_repo:
        description: 'Repositório do código (org/nome)'
        required: true
        type: string
      code_ref:
        description: 'Ref/SHA do código a construir'
        required: false
        default: 'main'
        type: string
      version:
        description: 'Versão SemVer vinda do repo do código'
        required: false
        default: ''
        type: string
      coolify_uuid:
        description: >
          uuid da app no Coolify, ou vários separados por vírgula quando papéis
          diferentes compartilham a imagem (api + worker + scheduler). Vazio
          pula o disparo — o build acontece e a imagem é publicada do mesmo jeito.

          NÃO é segredo: sozinho ele não faz nada, quem autoriza é o
          COOLIFY_TOKEN. Fica aqui, versionado ao lado da definição do app, para
          não virar mais um segredo a cadastrar por app no repositório.
        required: false
        default: ''
        type: string
      image:
        description: >
          Nome completo da imagem, sem tag. Vazio = deriva de
          ghcr.io/<owner>/<projeto>-<app>. Preencha quando o nome derivado não
          for o que já está em uso — trocar o nome obriga a repontar o destino.
        required: false
        default: ''
        type: string
    secrets:
      DEPLOY_APP_ID:          { required: true }
      DEPLOY_APP_PRIVATE_KEY: { required: true }
      COOLIFY_URL:            { required: false }
      COOLIFY_TOKEN:          { required: false }
      DOCKERHUB_USERNAME:     { required: false }
      DOCKERHUB_TOKEN:        { required: false }

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    # ⚠️ O contexto `secrets` NÃO pode ser usado em `if:` — o GitHub recusa o
    #    arquivo e o run morre em startup_failure, 0s, sem log nenhum para
    #    consultar. Expor no env do job é o caminho suportado para condicionar
    #    um passo à existência de um segredo.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      COOLIFY_APP_UUID:   ${{ inputs.coolify_uuid }}

    steps:
      # ⚠️ Token de App, não PAT. Vive 1 hora, é escopado aos repositórios onde o
      #    App foi instalado e não morre junto com uma pessoa.
      - name: Emitir token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout do código da aplicação
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.code_repo }}
          ref: ${{ inputs.code_ref }}
          fetch-depth: 0            # o git describe da versão precisa das tags
          token: ${{ steps.app-token.outputs.token }}
          path: code

      - name: Checkout deste repositório
        uses: actions/checkout@v7
        with:
          path: deploy

      - name: Resolver versão e SHA
        id: meta
        working-directory: code
        env:
          # Por env, não interpolado: valor vindo de payload externo não entra
          # no corpo do script.
          IN_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${IN_VERSION}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          fi
          echo "version=${VERSION}"                        >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)"    >> "$GITHUB_OUTPUT"

      - name: Nome da imagem
        id: img
        env:
          IN_IMAGE: ${{ inputs.image }}
        run: |
          if [ -n "$IN_IMAGE" ]; then
            echo "image=${IN_IMAGE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # deploy.meuprojeto.com + app api.meuprojeto.com
          #   → ghcr.io/<owner>/meuprojeto-api
          repo="${GITHUB_REPOSITORY##*/}"          # deploy.meuprojeto.com
          rest="${repo#*.}"; project="${rest%%.*}" # meuprojeto
          app="${{ inputs.app }}"; app="${app%%.*}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${project}-${app}" >> "$GITHUB_OUTPUT"

      - name: Preparar contexto de build
        run: |
          # O Dockerfile deste repo faz COPY app/… — o código precisa entrar no
          # contexto. .git e .github ficam de fora da imagem.
          cp -R code deploy/app
          rm -rf deploy/app/.git deploy/app/.github

          # ⚠️ Última barreira antes de o segredo virar camada pública de imagem.
          #    Uma vez publicada, a camada não se desfaz — apagar a tag não basta.
          leaked=$(find deploy/app -maxdepth 2 \( -name '.env' -o -name '.env.*' \) -print0 2>/dev/null \
            | xargs -0 -r awk -F= '
                /^(APP_KEY|[A-Z0-9_]*(PASSWORD|SECRET|TOKEN|SALT|DSN)[A-Z0-9_]*|[A-Z0-9_]+_KEY)=/ {
                  v=$2; gsub(/^"|"$/,"",v);
                  if (v != "" && $1 !~ /^VITE_/) print "  " FILENAME ": " $1
                }' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Segredo em texto puro no contexto de build. Abortando."
            echo "$leaked"
            exit 1
          fi
          echo "Nenhum segredo em texto puro no contexto."

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login no Docker Hub (base privada — opcional)
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: deploy
          file: deploy/.docker/Code/${{ inputs.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          # Três tags, com papéis diferentes:
          #
          #   sha-xxxxxxx  imutável — responde "que código exatamente é este?"
          #   vX.Y.Z       imutável — a mesma coisa, em linguagem de gente
          #   :prd         MÓVEL — o ponteiro que o destino observa
          #
          # ⚠️ Sozinha, a tag móvel é o que impede saber o que está em produção:
          #    `docker inspect` responde ":prd" e você não fica sabendo de nada.
          #    Ela só é aceitável porque as duas imutáveis existem ao lado — o
          #    digest de :prd sempre bate com uma sha- publicada.
          #
          # ⚠️ NÃO é :latest de propósito. :latest é o que o Docker puxa quando
          #    você não pede tag nenhuma — um `docker pull <imagem>` na máquina de
          #    alguém traria produção sem ninguém ter pedido.
          #
          # ⚠️ Um workflow_dispatch com code_ref de outra branch TAMBÉM move o
          #    :prd. É proposital: é assim que se volta atrás — dispare com o ref
          #    antigo e o ponteiro volta, sem rebuild de código novo.
          tags: |
            ${{ steps.img.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
            ${{ steps.img.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.img.outputs.image }}:prd
          # ⚠️ Sem o label `source` o GHCR cria o pacote SOLTO na organização, sem
          #    vínculo com repositório — e um token escopado por repo não o alcança.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ⚠️ A varredura do contexto, acima, confere a ENTRADA. Esta confere a
      #    SAÍDA — e é a que vale, porque um Dockerfile errado pode trazer para a
      #    imagem algo que não estava no contexto (um COPY largo demais, um passo
      #    que gera .env). Roda ANTES do deploy: imagem suja nunca chega ao ar.
      - name: Conferir que a imagem não carrega segredo
        env:
          IMG: ${{ steps.img.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
        run: |
          docker pull -q "$IMG"
          suja=0
          for f in /var/www/html/.env /var/www/html/.env.local \
                   /var/www/html/.env.production /var/www/html/oauth-private.key \
                   /var/www/html/storage/oauth-private.key; do
            if docker run --rm --entrypoint sh "$IMG" -c "test -e $f" 2>/dev/null; then
              echo "::error::A imagem contém ${f}. Isso nunca pode acontecer."
              suja=1
            fi
          done
          [ "$suja" -eq 0 ] || exit 1
          echo "Imagem sem env e sem chave privada."

      - name: Disparar deploy no Coolify
        if: env.COOLIFY_APP_UUID != ''
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          # Aceita vários UUIDs separados por vírgula: a imagem da API serve
          # api + worker + scheduler, e os três recriam no mesmo push.
          for uuid in ${COOLIFY_APP_UUID//,/ }; do
            echo "Deploy → $uuid"
            curl --fail --silent --show-error -L -X POST \
              "${COOLIFY_URL}/api/v1/deploy?uuid=${uuid}&force=false" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}"
            echo
          done

      - name: Resumo
        run: |
          {
            echo "### ${{ inputs.app }} — ${{ steps.meta.outputs.version }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Imagem | \`${{ steps.img.outputs.image }}\` |"
            echo "| Tags | \`sha-${{ steps.meta.outputs.short_sha }}\`, \`${{ steps.meta.outputs.version }}\`, \`prd\` |"
            echo "| Código | \`${{ inputs.code_repo }}@${{ inputs.code_ref }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
