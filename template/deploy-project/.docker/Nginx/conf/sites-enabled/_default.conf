server {
    listen 80 default_server;
    server_name _;

    # Log files for Debugging
    access_log off;
    error_log /proc/self/fd/2;

    # Webroot Directory for Laravel project
    root "/var/www/html/platform.__DOMAIN__/public";
    index index.php index.html index.htm;

    charset utf-8;

    if ($request_method !~ ^(OPTIONS|GET|HEAD|POST|PUT|DELETE)$ ) {
        return 444; 
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~* .(jpg|jpeg|png|gif|ico|css|js)$ {
        expires 365d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {        
        try_files $uri = 404;
        
        # Upstream via variavel: obriga o nginx a resolver o DNS por requisicao
        # (respeitando o `valid=` do resolver em nginx.conf) em vez de fixar o IP
        # do container no carregamento da config. Ver nginx.conf.
        set $php_upstream __PROJECT__-php:9001;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;

        include fastcgi_params;
        
        fastcgi_param  SCRIPT_FILENAME      $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO            $fastcgi_path_info;        
        fastcgi_param  QUERY_STRING         $query_string;
        fastcgi_param  REQUEST_METHOD       $request_method;
        fastcgi_param  CONTENT_TYPE         $content_type;
        fastcgi_param  CONTENT_LENGTH       $content_length;
        fastcgi_param  SCRIPT_NAME          $fastcgi_script_name;
        fastcgi_param  REQUEST_URI          $request_uri;
        fastcgi_param  DOCUMENT_URI         $document_uri;
        fastcgi_param  DOCUMENT_ROOT        $document_root;
        fastcgi_param  SERVER_PROTOCOL      $server_protocol;
        fastcgi_param  GATEWAY_INTERFACE    CGI/1.1;
        fastcgi_param  SERVER_SOFTWARE      nginx/$nginx_version;
        fastcgi_param  REMOTE_ADDR          $remote_addr;
        fastcgi_param  REMOTE_PORT          $remote_port;
        fastcgi_param  SERVER_ADDR          $server_addr;
        fastcgi_param  SERVER_PORT          $server_port;
        fastcgi_param  SERVER_NAME          $server_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
