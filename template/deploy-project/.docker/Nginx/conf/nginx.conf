user                nginx;
worker_processes    auto;

error_log           /var/log/nginx/error.log notice;
pid                 /var/run/nginx.pid;

events {
    # worker_connections  1024;
}

http {
    include         /etc/nginx/mime.types;
    default_type    application/octet-stream;

    log_format      main '$remote_addr - $remote_user [$time_local]  $status '
                        '"$request" $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log      /var/log/nginx/access.log  main;
    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;

    ## Start: Real IP (Cloudflare) ##
    # O Nginx só é alcançado pelo Traefik (mesma rede Docker) — nunca direto da internet.
    # Sem isso, $remote_addr é sempre o IP do container do Traefik (ex: 172.20.0.14), o
    # mesmo para TODO visitante, e é isso que vai pro REMOTE_ADDR do PHP-FPM via
    # fastcgi_param em cada site .conf. CF-Connecting-IP é o header que o Cloudflare
    # sempre preenche com o IP real do visitante (quando os hosts do projeto rodam
    # atrás da Cloudflare).
    # Confiar nele só é seguro enquanto a porta 80/443 da VM não aceitar conexão direta
    # (bypass do Cloudflare) — ver harden-vm / restringir firewall às faixas de IP da CF.
    set_real_ip_from             172.16.0.0/12;
    real_ip_header               CF-Connecting-IP;
    ## End: Real IP (Cloudflare) ##

    ## Start: DNS Resolver ##
    # DNS embutido do Docker (redes user-defined, ex: `shared`).
    # Obrigatório porque os sites usam `fastcgi_pass $php_upstream` (via variável).
    # Sem isso o nginx resolveria o nome do container UMA vez, no carregamento da
    # config, e manteria o IP em cache para sempre — quando o Watchtower recria o
    # container do PHP (stop/rm/create), o IP muda e o nginx passa a falar com um
    # IP morto até ser reiniciado à mão. O `valid=10s` limita esse cache a 10s.
    resolver                    127.0.0.11 valid=10s ipv6=off;
    resolver_timeout            5s;
    ## End: DNS Resolver ##

    ## Start: Size Limits & Buffer Overflows ##
    client_body_buffer_size     64K;
    client_header_buffer_size   16k;
    client_max_body_size        500M;
    large_client_header_buffers 4 32k;
    ## END: Size Limits & Buffer Overflows ##    

    ## Start: Timeouts ##
    client_body_timeout         10;
    client_header_timeout       10;
    keepalive_timeout           10 10;
    send_timeout                10;
    ## End: Timeouts ##   

    gzip                        on;
    gzip_comp_level             4;
    gzip_min_length             1000;
    gzip_proxied                expired no-cache no-store private auth;
    gzip_types                  text/plain text/css application/json application/javascript text/xml application/xml;

    include /etc/nginx/sites-enabled/*.conf;
}