server {
    listen 2376;

    # Rewrite API versions < 1.44 (unsupported by Docker Desktop) to 1.44
    location ~ ^/v1\.(1[0-9]|[23][0-9]|4[0-3])/(.*) {
        proxy_pass http://docker-proxy:2375/v1.44/$2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://docker-proxy:2375;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
